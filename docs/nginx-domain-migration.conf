user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 8M;

    sendfile on;
    keepalive_timeout 65;

    # ---------- Upstreams ----------
    upstream app_classchats { server 192.168.1.97:3000; }
    upstream app_mc         { server 192.168.1.97:8800; }
    upstream app_grades     { server 192.168.1.97:3001; }
    upstream app_game       { server 192.168.1.97:3002; }
    upstream app_brobattles { server 192.168.1.97:3002; }
    upstream app_bns        { server 192.168.1.97:3003; }
    upstream app_ops        { server 192.168.1.97:5173; }

    # Where Certbot (webroot) drops challenges
    # Make sure this dir exists: /var/www/letsencrypt
    # sudo mkdir -p /var/www/letsencrypt
    # sudo chown -R www-data:www-data /var/www/letsencrypt

    # ---------- HTTP (80): classchats family ----------
    server {
        listen 80;
        server_name classchats.net mc.classchats.net grades.classchats.net game.classchats.net bns.classchats.net ops.classchats.net;

        # ACME path (must come BEFORE any redirect)
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
        }

        # Everything else → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- HTTP (80): brobattles.dev ----------
    server {
        listen 80;
        server_name brobattles.dev www.brobattles.dev classchats.brobattles.dev mc.brobattles.dev grades.brobattles.dev game.brobattles.dev bns.brobattles.dev ops.brobattles.dev;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # (Optional) HTTP catch-all
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # ---------- HTTPS (443): classchats family ----------
    server {
        listen 443 ssl http2;
        server_name classchats.net mc.classchats.net grades.classchats.net game.classchats.net bns.classchats.net ops.classchats.net;

        ssl_certificate     /etc/letsencrypt/live/classchats.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/classchats.net/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Public originals written by MediaGrabber on this device.
        location ^~ /downloads/ {
            if ($host !~ "^bns\.(classchats\.net|brobattles\.dev)$") { return 404; }
            if ($uri ~ "(^|/)\.") { return 404; }
            alias /var/www/mediagrabber-downloads/;
            autoindex off;
            sendfile on;
            gzip off;
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store" always;
            limit_except GET { deny all; }
        }

        # Proxy private API to local bot backend
        location /api/download {
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;

            # Optional allowlist (replace with your bot backend IP)
            # allow 127.0.0.1;
            # deny all;
        }

        # Route each subdomain to its upstream by $host
        location / {
            if ($host = classchats.net)          { proxy_pass http://app_classchats; break; }
            if ($host = mc.classchats.net)       { proxy_pass http://app_mc;         break; }
            if ($host = grades.classchats.net)   { proxy_pass http://app_grades;     break; }
            if ($host = game.classchats.net)     { proxy_pass http://app_game;       break; }
            if ($host = bns.classchats.net)      { proxy_pass http://app_bns;        break; }
	    if ($host = ops.classchats.net)      { proxy_pass http://app_ops;        break; }
            return 404;
        }
    }

    # ---------- HTTPS (443): brobattles.dev ----------
    # Expand the brobattles.dev certificate to cover ALL listed names before
    # applying this configuration. See docs/domain-migration.md.
    server {
        listen 443 ssl http2;
        server_name brobattles.dev www.brobattles.dev classchats.brobattles.dev mc.brobattles.dev grades.brobattles.dev game.brobattles.dev bns.brobattles.dev ops.brobattles.dev;

        ssl_certificate     /etc/letsencrypt/live/brobattles.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/brobattles.dev/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Public originals written by MediaGrabber on this device.
        location ^~ /downloads/ {
            if ($host !~ "^bns\.(classchats\.net|brobattles\.dev)$") { return 404; }
            if ($uri ~ "(^|/)\.") { return 404; }
            alias /var/www/mediagrabber-downloads/;
            autoindex off;
            sendfile on;
            gzip off;
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store" always;
            limit_except GET { deny all; }
        }

        # Proxy private API to local bot backend
        location /api/download {
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;

            # Optional allowlist (replace with your bot backend IP)
            # allow 127.0.0.1;
            # deny all;
        }

        # All service ports are unchanged; only hostnames are added.
        location / {
            if ($host = brobattles.dev)             { proxy_pass http://app_brobattles; break; }
            if ($host = www.brobattles.dev)         { proxy_pass http://app_brobattles; break; }
            if ($host = game.brobattles.dev)        { proxy_pass http://app_game;       break; }
            if ($host = classchats.brobattles.dev)  { proxy_pass http://app_classchats; break; }
            if ($host = mc.brobattles.dev)          { proxy_pass http://app_mc;         break; }
            if ($host = grades.brobattles.dev)      { proxy_pass http://app_grades;     break; }
            if ($host = bns.brobattles.dev)         { proxy_pass http://app_bns;        break; }
            if ($host = ops.brobattles.dev)         { proxy_pass http://app_ops;        break; }
            return 404;
        }
    }

    # (Optional) HTTPS catch-all so unknown hosts don't leak a random cert
    server {
        listen 443 ssl http2 default_server;
        server_name _;
        ssl_certificate     /etc/letsencrypt/live/classchats.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/classchats.net/privkey.pem;
        return 444;
    }
}
